YAML

name: 自动更新衰老前沿文献

on:
  schedule:
    # 每天 UTC 时间 0 点（北京时间早晨 8 点）自动执行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击立即运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行抓取脚本
        run: python fetch_news.py

      - name: 提交并推送更新到网页
        run: |
          git config --global user.name 'LongevityBot'
          git config --global user.email 'bot@longevitylab.org'
          git add index.html
          git commit -m "Auto-update: 同步最新长寿科研文献" || exit 0
          git pushYAML

